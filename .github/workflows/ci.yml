name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        paho: ["1.6 (Ubuntu/Debian package)", "2.x (pip)"]
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto python3-paho-mqtt python3-yaml
      - name: paho-mqtt 2.x
        if: startsWith(matrix.paho, '2')
        run: sudo pip install --break-system-packages "paho-mqtt>=2,<3"
      - name: Privacy check
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: python3 tools/privacy_check.py
      - name: Unit tests
        run: /usr/bin/python3 -m unittest tests/test_units.py
      - name: Immich monitor
        run: /usr/bin/python3 tests/test_immich_monitor.py
      - name: Self-update end to end
        timeout-minutes: 17
        run: timeout 900 /usr/bin/python3 tests/test_e2e_selfupdate.py
      - name: Compose end to end
        timeout-minutes: 17
        run: timeout 900 /usr/bin/python3 tests/test_e2e_compose.py
      - name: Application plugins end to end
        timeout-minutes: 17
        run: timeout 900 /usr/bin/python3 tests/test_e2e_apps.py
      - name: Bridge logs (on failure)
        if: failure() || cancelled()
        run: |
          sudo pip install --break-system-packages -q py-spy || true
          for pid in $(pgrep -f "bridge.py --name"); do
            echo "::group::threads of $(tr '\0' ' ' < /proc/$pid/cmdline)"; sudo py-spy dump --pid "$pid" || true; echo "::endgroup::"
          done
          for f in /tmp/imha-e2e-*/bridge.out /tmp/habridge-*/*.out /tmp/habridge-*/*/log/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"; tail -n 150 "$f"; echo "::endgroup::"
          done
